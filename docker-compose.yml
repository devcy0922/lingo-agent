services:
  lingo-agent:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        LINGO_VERSION: ${LINGO_VERSION:-1.3.1}
        LINGO_GIT_SHA: ${LINGO_GIT_SHA:-unknown}
    container_name: lingo-agent
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 47081
      HOST: 0.0.0.0
      DATABASE_URL: sqlite:///../data/db.sqlite3
      OUTPUT_DIR: ../data/output
    volumes:
      - lingo_data:/app/data
    # Edge 라우트는 라벨이 아니라 admin 요청으로 만든 edge-infra vhost(nginx/config/conf.d/lingo.conf)가 맡는다.
    # 컨테이너에 edge.* 라벨을 다시 붙이지 않는다(2026-11-11, edge-controller 승인센터 중단).
    networks:
      - shared_ai_net

networks:
  shared_ai_net:
    external: true
    name: ${SHARED_NETWORK_NAME:-shared_ai_net}

volumes:
  lingo_data:
    name: lingo-agent-data
