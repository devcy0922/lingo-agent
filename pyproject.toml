[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lingo-agent"
version = "1.3.1"
description = "Unified i18n & Markdown Translation Agent, CLI, and Review Gate"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "GoVail Platform Team" }
]
dependencies = [
    "httpx>=0.25.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
langgraph = [
    "langgraph-process @ git+https://github.com/devcy0922/langgraph-process.git@v0.1.0",
]

[project.scripts]
lingo = "lingo.cli:main"

[tool.setuptools]
py-modules = ["translate", "translate_markdown"]

[tool.setuptools.packages.find]
include = ["lingo*"]
