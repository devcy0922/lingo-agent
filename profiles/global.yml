version: "1"
name: "global"
description: "전사 공통 기본 용어 및 브랜드 네임스페이스"

tone:
  style: "general"
  formality: "polite"
  guidelines:
    - "고유명사와 기술 표준 약어는 원문을 최대한 존중합니다."
    - "문맥에 맞는 정확하고 일관된 기술 용어를 사용합니다."

terms:
  - term: "LingoAgent"
    translations:
      en-US: "LingoAgent"
      ja-JP: "LingoAgent"
    forbidden: ["링고에이전트", "Lingo Agent"]
    note: "공식 브랜드명 불변"

  - term: "GoVail"
    translations:
      en-US: "GoVail"
      ja-JP: "GoVail"
    note: "플랫폼 공식 명칭"

  - term: "CI/CD"
    translations:
      en-US: "CI/CD"
      ja-JP: "CI/CD"

prohibited_phrases:
  - "클릭하세요" # 권장: "선택해 주세요" 또는 구체적 행동 명시
